[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# /ofertas → função Node.js que injeta OG tags corretos por ?s=TENANT_ID
# Funciona para browser E bots (WhatsApp, Telegram, Google)
[[redirects]]
  from   = "/ofertas"
  to     = "/.netlify/functions/og-ofertas"
  status = 200

[[redirects]]
  from   = "/api/priceref"
  to     = "/.netlify/functions/priceref"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
