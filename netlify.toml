[build]
  command      = "npm run build"
  publish      = "dist"
  functions    = "netlify/functions"
  edge_functions = "netlify/edge-functions"

[functions]
  node_bundler = "esbuild"

# Edge function intercepta /ofertas para injetar OG tags dinâmicos por fornecedor
[[edge_functions]]
  path     = "/ofertas"
  function = "og-ofertas"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
