[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# wa-bot precisa de mais tempo: Railway(~3.5s) + OpenAI(~3s) + Blobs(~1s) = ~7.5s
[functions."wa-bot"]
  timeout = 26

# zara-chat: tenta Groq + fallback OpenAI — precisa de até 20s em cold start
[functions."zara-chat"]
  timeout = 20

# /instalar-caixa → página de instalação do PWA Terminal de Caixa
[[redirects]]
  from   = "/instalar-caixa"
  to     = "/terminal-app.html"
  status = 200

# /ofertas → função Node.js que injeta OG tags corretos por ?s=TENANT_ID
# Funciona para browser E bots (WhatsApp, Telegram, Google)
[[redirects]]
  from   = "/ofertas"
  to     = "/.netlify/functions/og-ofertas"
  status = 200

[[redirects]]
  from   = "/api/zara-chat"
  to     = "/.netlify/functions/zara-chat"
  status = 200

[[redirects]]
  from   = "/api/priceref"
  to     = "/.netlify/functions/priceref"
  status = 200

# WhatsApp AI bot — Evolution API envia webhook para este endpoint
[[redirects]]
  from   = "/wa-bot"
  to     = "/.netlify/functions/wa-bot"
  status = 200


[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# index.html e sw.js nunca devem ser cacheados — sempre frescos
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma        = "no-cache"
    Expires       = "0"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Assets com hash de conteúdo podem ser cacheados para sempre
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
