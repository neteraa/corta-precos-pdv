<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Terminal Corta Preços</title>
  <meta name="description" content="Terminal de Caixa — Corta Preços" />
  <meta name="theme-color" content="#f97316" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Caixa" />
  <link rel="manifest" href="/terminal-manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%; background: #04080f;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .spinner {
      width: 44px; height: 44px; border: 3px solid rgba(249,115,22,.2);
      border-top-color: #f97316; border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #475569; font-size: 13px; font-weight: 600; letter-spacing: .5px; }
    .btn {
      margin-top: 8px; padding: 10px 24px; border-radius: 12px;
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: #fff; font-weight: 800; font-size: 14px;
      border: none; cursor: pointer; text-decoration: none;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Abrindo terminal de caixa...</p>
  <script>
    // Redireciona para /caixa (seleção de operador + PIN)
    // Se instalado como PWA, abre direto sem precisar da URL principal
    window.location.replace('/caixa');
  </script>
  <noscript>
    <a href="/caixa" class="btn">Abrir Terminal de Caixa →</a>
  </noscript>
</body>
</html>
