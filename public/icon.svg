<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#111111"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ff7a1f"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ff7a1f"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ea580c" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- dark background square -->
  <rect width="200" height="200" rx="36" fill="url(#bgGrad)"/>

  <!-- subtle grid lines (background texture) -->
  <line x1="0" y1="100" x2="200" y2="100" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>
  <line x1="100" y1="0" x2="100" y2="200" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>

  <!-- ── SCISSORS ── -->
  <!-- Upper blade -->
  <path d="M 30 58 Q 100 82 148 70" stroke="url(#bladeGrad)" stroke-width="9" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Lower blade -->
  <path d="M 30 98 Q 100 82 148 94" stroke="url(#bladeGrad)" stroke-width="9" fill="none" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Pivot screw -->
  <circle cx="97" cy="82" r="10" fill="#ea580c" filter="url(#shadow)"/>
  <circle cx="97" cy="82" r="5.5" fill="#0a0a0a"/>
  <circle cx="97" cy="82" r="2.5" fill="#ff7a1f"/>

  <!-- Upper handle ring -->
  <circle cx="22" cy="54" r="14" fill="none" stroke="url(#bladeGrad)" stroke-width="7" stroke-linecap="round"/>
  <!-- Lower handle ring -->
  <circle cx="22" cy="102" r="14" fill="none" stroke="url(#bladeGrad)" stroke-width="7"/>

  <!-- CUT mark dashes (snip snip) -->
  <line x1="152" y1="64" x2="165" y2="60" stroke="#ea580c" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="152" y1="72" x2="168" y2="72" stroke="#ea580c" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="152" y1="80" x2="165" y2="84" stroke="#ea580c" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- ── PRICE TAG ── -->
  <rect x="138" y="50" width="48" height="44" rx="7" fill="url(#tagGrad)" filter="url(#shadow)"/>
  <!-- tag hole -->
  <circle cx="147" cy="59" r="4.5" fill="#0a0a0a"/>
  <!-- price lines -->
  <rect x="148" y="67" width="28" height="5" rx="2.5" fill="#fff" opacity="0.9"/>
  <rect x="148" y="76" width="20" height="4" rx="2" fill="#fff" opacity="0.55"/>
  <rect x="148" y="84" width="24" height="4" rx="2" fill="#fff" opacity="0.35"/>

  <!-- ── WORDMARK ── -->
  <!-- "CORTA" -->
  <text x="100" y="140"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-weight="900"
    font-size="36"
    letter-spacing="-1"
    text-anchor="middle"
    fill="#ffffff">CORTA</text>

  <!-- "PREÇOS" in orange -->
  <text x="100" y="174"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-weight="900"
    font-size="32"
    letter-spacing="1"
    text-anchor="middle"
    fill="url(#tagGrad)">PREÇOS</text>

  <!-- small $ accent on the right of PREÇOS -->
  <circle cx="175" cy="162" r="10" fill="#ea580c" opacity="0.15"/>
</svg>
