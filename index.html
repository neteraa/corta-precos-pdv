    <!-- Apple Touch Icons para iOS -->
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <title>ZatendeStok – Sistema de Gestão para Mercados</title>

    <!-- Open Graph / WhatsApp preview -->
    <meta property="og:type"         content="website" />
    <meta property="og:url"          content="https://zatendestok.com.br/" />
    <meta property="og:site_name"    content="ZatendeStok" />
    <meta property="og:title"        content="ZatendeStok – Sistema de Gestão para Mercados" />
    <meta property="og:description"  content="PDV, estoque, fiado, promoções e etiquetas em um só lugar. Funciona no celular, no PC e offline. Ative para o seu mercado." />
    <meta property="og:image"        content="https://zatendestok.com.br/og-image.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"    content="ZatendeStok – Sistema completo de gestão para mercados" />
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="ZatendeStok – Sistema de Gestão para Mercados" />
    <meta name="twitter:description" content="PDV, estoque, fiado, promoções e etiquetas em um só lugar." />
    <meta name="description"         content="ZatendeStok: sistema completo de gestão para mercados. PDV, estoque, fiado, promoções, etiquetas. Simples, rápido, funciona offline." />

    <!-- PWA: instala como app no Windows/Android/iOS -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#10b981" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ZatendeStok" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    
    <!-- Build version - injetado no build pelo Vite -->
    <meta name="app-version" content="__BUILD_VERSION__" />
  </head>
  <body class="bg-gray-50">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const reg = await navigator.serviceWorker.register('/sw.js')

            // FORÇA novo SW a ativar imediatamente
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing
              if (!newWorker) return
              
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('[SW] Nova versão instalada! Ativando...')
                  newWorker.postMessage({ type: 'SKIP_WAITING' })
                }
              })
            })

            // Quando novo SW assume controle → RELOAD IMEDIATO
            navigator.serviceWorker.addEventListener('controllerchange', () => {
              console.log('[SW] Novo SW assumiu controle! Recarregando...')
              window.location.reload()
            })

            // Check de update AGRESSIVO: a cada 10s
            setInterval(() => reg.update(), 10000)
            
            // Check quando tab fica visível
            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') reg.update()
            })
            
            // Check inicial após 2s
            setTimeout(() => reg.update(), 2000)
          } catch {}
        })
      }
    </script>
  </body>
</html>
