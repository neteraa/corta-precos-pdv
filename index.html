<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>ZatendeStok – Sistema de Gestão para Mercados</title>

    <!-- Open Graph / WhatsApp preview -->
    <meta property="og:type"         content="website" />
    <meta property="og:url"          content="https://zatendestok.com.br/" />
    <meta property="og:site_name"    content="ZatendeStok" />
    <meta property="og:title"        content="ZatendeStok – Sistema de Gestão para Mercados" />
    <meta property="og:description"  content="PDV, estoque, fiado, promoções e etiquetas em um só lugar. Funciona no celular, no PC e offline. Ative para o seu mercado." />
    <meta property="og:image"        content="https://zatendestok.com.br/og-image.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"    content="ZatendeStok – Sistema completo de gestão para mercados" />
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="ZatendeStok – Sistema de Gestão para Mercados" />
    <meta name="twitter:description" content="PDV, estoque, fiado, promoções e etiquetas em um só lugar." />
    <meta name="description"         content="ZatendeStok: sistema completo de gestão para mercados. PDV, estoque, fiado, promoções, etiquetas. Simples, rápido, funciona offline." />

    <!-- PWA: instala como app no Windows/Android/iOS -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#10b981" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ZatendeStok" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body class="bg-gray-50">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const reg = await navigator.serviceWorker.register('/sw.js')

            const notifyUpdate = () => window.dispatchEvent(new Event('sw-update-ready'))

            // New SW found — wait for it to finish installing, then notify
            const onUpdateFound = () => {
              const sw = reg.installing
              if (!sw) return
              sw.addEventListener('statechange', () => {
                if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                  notifyUpdate()
                }
              })
            }
            reg.addEventListener('updatefound', onUpdateFound)

            // When new SW takes control → reload immediately (startup case)
            navigator.serviceWorker.addEventListener('controllerchange', () => {
              if (performance.now() < 4000) window.location.reload()
            })

            // Check for updates every 5 min and on visibility change
            setInterval(() => reg.update(), 5 * 60 * 1000)
            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') reg.update()
            })
          } catch {}
        })
      }
    </script>
  </body>
</html>
